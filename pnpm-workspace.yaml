# Only these dependencies may run install scripts.
# bufferutil / utf-8-validate / keccak are optional native speedups with JS fallbacks.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  "@tailwindcss/oxide": true
  sharp: true
  bufferutil: false
  utf-8-validate: false
  keccak: false

# Patched versions of vulnerable transitive deps (pnpm audit, 2026-10-19).
overrides:
  postcss: ">=8.5.23"
  ws@8: ">=8.21.0 <9"
  uuid: ">=11.1.1"
  decode-uri-component: ">=0.5.0"
